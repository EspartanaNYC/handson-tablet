name: Montar o app do HandsOn

on:
  push:
    branches: [main]
    paths-ignore: [".github/teste_no_emulador.sh", ".github/workflows/teste.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Montar o APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Preparar o arquivo
        run: cp app/build/outputs/apk/debug/app-debug.apk HandsOn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HandsOn-apk
          path: HandsOn.apk

      - name: Publicar para baixar no tablet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima HandsOn.apk \
            --title "HandsOn para tablet (versão ${{ github.run_number }})" \
            --notes "Toque em HandsOn.apk para baixar e instalar no tablet." \
            --latest
